name: lab-rescue
on:
  workflow_dispatch:
jobs:
  rescue:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          echo "--- plain ---"
          curl -s -m 10 -o /dev/null -w "plain:%{http_code}\n" http://85.174.249.129:8081/api/instance
          curl -s -m 10 http://85.174.249.129:8081/api/instance | head -c 60; echo
          echo "--- tls ---"
          curl -sk -m 10 --resolve netbird.sodalab.pro:8081:85.174.249.129 -o /dev/null -w "tls:%{http_code}\n" https://netbird.sodalab.pro:8081/api/instance
          curl -sk -m 10 --resolve netbird.sodalab.pro:8081:85.174.249.129 https://netbird.sodalab.pro:8081/ -o /dev/null -w "dash:%{http_code}\n"
