name: port-scan
on: [workflow_dispatch]
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
    - name: scan-tcp
      run: |
        echo "=== TCP scan ==="
        for port in 80 443 8080 8081 8082 8083 8443 22 23 21 7547 5060 3478 51820 3389 5900 17988 3306 4443 8888 9090 49152; do
          timeout 3 bash -c "echo > /dev/tcp/85.174.249.129/$port" 2>/dev/null && echo "TCP $port OPEN" || echo "TCP $port closed"
        done
    - name: scan-udp
      run: |
        echo "=== UDP scan ==="
        for port in 53 123 3478 51820 5060 1900; do
          timeout 3 bash -c "echo test | nc -u -w 2 85.174.249.129 $port" 2>/dev/null && echo "UDP $port sent" || echo "UDP $port fail"
        done
    - name: ipv6-ssh
      run: |
        echo "=== IPv6 test ==="
        mkdir -p ~/.ssh
        echo "${{ secrets.RECOVERY_KEY }}" > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519
        timeout 15 ssh -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new root@2a00:62c0:40:c00:6e2b:59ff:fea3:fe55 "echo CONNECTED" 2>&1 || echo "v6-SSH-FAILED"
        timeout 15 ssh -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new root@[2a00:62c0:40:c00:6e2b:59ff:fea3:fe55]:8081 "echo P8081" 2>&1 || echo "v6-8081-FAILED"
